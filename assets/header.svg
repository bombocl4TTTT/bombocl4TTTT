<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#111622" />
    </linearGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#30363d" opacity="0.5" />
    </pattern>
  </defs>

  <!-- Background card -->
  <rect x="1" y="1" width="878" height="158" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2" />
  
  <!-- Subtle ambient dot grid on right portion -->
  <rect x="460" y="2" width="416" height="156" rx="12" fill="url(#dotGrid)" opacity="0.4" />
  
  <!-- Subtle coral accent bar -->
  <path d="M 12 1 L 160 1" stroke="#ff735c" stroke-width="2.5" stroke-linecap="round" />

  <!-- Preheader pill / status -->
  <g transform="translate(36, 32)">
    <circle cx="4" cy="4" r="3.5" fill="#ff735c" />
    <text x="16" y="7.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#8b949e">FULL-STACK DEVELOPER &amp; SYSTEMS BUILDER</text>
  </g>

  <!-- Name -->
  <text x="36" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5" fill="#f0f6fc">
    Reydian Delagao <tspan font-size="20" font-weight="400" fill="#6e7681">(Red)</tspan>
  </text>

  <!-- Subtitle -->
  <text x="36" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8b949e">
    Building scalable web platforms, low-level Linux tooling, and AI automation workflows.
  </text>

  <!-- Bottom Location / Web -->
  <g transform="translate(36, 134)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#6e7681">
      Bacolod, Philippines &nbsp;•&nbsp; UTC+8
    </text>
  </g>

  <g transform="translate(844, 134)">
    <text x="0" y="0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ff735c">
      reydian.tech ↗
    </text>
  </g>
</svg>
