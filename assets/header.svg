<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="878" height="168" rx="8" fill="url(#cardBg)" stroke="#21262d" stroke-width="1" />

  <!-- Top Row: Monospace Breadcrumb & Domain -->
  <text x="32" y="32" font-family="ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="500" fill="#7d8590">
    bombocl4TTTT / profile
  </text>
  
  <text x="848" y="32" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#ff735c">
    reydian.tech ↗
  </text>

  <!-- Middle: Name & Title -->
  <text x="32" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.3" fill="#f0f6fc">
    Reydian Delagao <tspan font-size="17" font-weight="400" fill="#8b949e">(Red)</tspan>
  </text>
  
  <text x="32" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e">
    Full-Stack Developer &amp; Systems Builder · Building resilient web platforms, Linux tooling, and AI workflows.
  </text>

  <!-- Hairline Divider -->
  <line x1="32" y1="118" x2="848" y2="118" stroke="#21262d" stroke-width="1" />

  <!-- Bottom Spec Columns -->
  <!-- Col 1: Location -->
  <g transform="translate(32, 134)">
    <text x="0" y="0" font-family="ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="600" letter-spacing="1" fill="#6e7681">LOCATION</text>
    <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#c9d1d9">Bacolod, Philippines (UTC+8)</text>
  </g>

  <!-- Col 2: Core Focus -->
  <g transform="translate(320, 134)">
    <text x="0" y="0" font-family="ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="600" letter-spacing="1" fill="#6e7681">CORE FOCUS</text>
    <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#c9d1d9">Systems Architecture · Full-Stack · AI Workflows</text>
  </g>

  <!-- Col 3: Primary Languages -->
  <g transform="translate(640, 134)">
    <text x="0" y="0" font-family="ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="600" letter-spacing="1" fill="#6e7681">PRIMARY STACK</text>
    <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#c9d1d9">TypeScript · Rust · Python · Go</text>
  </g>
</svg>
