<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#111620" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff735c" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ff735c" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ff735c" stop-opacity="0" />
    </linearGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#30363d" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background card with subtle border -->
  <rect x="1" y="1" width="878" height="178" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2" />
  
  <!-- Subtle ambient dot grid on right portion -->
  <rect x="440" y="2" width="436" height="176" rx="12" fill="url(#dotGrid)" opacity="0.4" />
  
  <!-- Subtle top accent line -->
  <path d="M 12 1 L 180 1" stroke="#ff735c" stroke-width="2.5" stroke-linecap="round" />

  <!-- Preheader pill / status -->
  <g transform="translate(36, 36)">
    <circle cx="4" cy="4" r="3.5" fill="#ff735c" />
    <text x="16" y="7.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#8b949e">FULL-STACK &amp; SYSTEMS ENGINEER</text>
  </g>

  <!-- Name -->
  <text x="36" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5" fill="#f0f6fc">
    Reydian Delagao <tspan font-size="22" font-weight="400" fill="#6e7681">(Red)</tspan>
  </text>

  <!-- Description -->
  <text x="36" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8b949e">
    Building reliable distributed services, low-level tooling, and typed agent execution runtimes.
  </text>

  <!-- Tech tags / footer -->
  <g transform="translate(36, 142)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="56" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="28" y="14.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#c9d1d9">Rust</text>
    
    <!-- Tag 2 -->
    <rect x="64" y="0" width="84" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="106" y="14.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#c9d1d9">TypeScript</text>
    
    <!-- Tag 3 -->
    <rect x="156" y="0" width="88" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="200" y="14.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#c9d1d9">Linux / eBPF</text>
    
    <!-- Tag 4 -->
    <rect x="252" y="0" width="66" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="285" y="14.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#c9d1d9">Python</text>
    
    <!-- Tag 5 -->
    <rect x="326" y="0" width="138" height="22" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="395" y="14.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#c9d1d9">Distributed Systems</text>
  </g>

  <!-- Right side domain -->
  <g transform="translate(844, 154)">
    <text x="0" y="0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#ff735c">
      reydian.tech ↗
    </text>
  </g>
</svg>
